<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Página não encontrada – Central Calculadora</title>
  <link rel="icon" href="/Central-Calculadora/icone.jpg" />
  <style>
    :root{
      --canvas:#eef1f5; --surface:#ffffff; --ink:#1a2433; --ink-2:#5a6a7d;
      --line:#d7dee7; --accent:#002554; --radius:8px;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --canvas:#13171f; --surface:#1b212b; --ink:#e7edf4; --ink-2:#97a4b5;
        --line:#2b3440; --accent:#2d6cb0;
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      background:var(--canvas); color:var(--ink);
      font-family:var(--sans); font-size:14px; line-height:1.5;
    }
    .box{
      max-width:420px; width:100%;
      padding:24px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      text-align:center;
    }
    h1{margin:0 0 6px; font-size:16px; font-weight:600}
    p{margin:0 0 18px; color:var(--ink-2); font-size:13px}
    a{
      display:inline-block;
      padding:8px 16px;
      background:var(--accent); color:#fff;
      border-radius:4px;
      font-size:13px; font-weight:600; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Página não encontrada</h1>
    <p>O endereço digitado não existe aqui. Confira o link ou volte ao menu das ferramentas.</p>
    <a href="/Central-Calculadora/">Voltar ao menu</a>
  </div>
</body>
</html>
